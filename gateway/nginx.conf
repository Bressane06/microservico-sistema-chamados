# API Gateway — ponto único de entrada do sistema (porta 8080 no host).
# Os microsserviços não publicam portas no host: só o gateway é acessível.

upstream api_chamados {
    server api-chamados:8000;
}

upstream api_tecnicos {
    server api-tecnicos:8081;
}

# Registra o tempo de resposta do upstream (útil para a demonstração).
log_format gateway '$remote_addr [$time_local] "$request" $status '
                   'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time '
                   'req_id=$request_id';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log gateway;

    # Cabeçalhos repassados a todos os serviços.
    # O cabeçalho traceparent (W3C) é repassado por padrão, mantendo o
    # rastreamento distribuído no Jaeger.
    proxy_set_header Host              $http_host;   # mantém a porta (redirects do FastAPI/Spring)
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    add_header X-Request-ID $request_id always;

    # Respostas amigáveis quando um serviço está fora do ar.
    error_page 502 503 504 @servico_indisponivel;

    location @servico_indisponivel {
        default_type application/json;
        return 503 '{"detail":"Serviço temporariamente indisponível."}';
    }

    # --- Saúde do próprio gateway -----------------------------------------
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","servico":"api-gateway"}';
    }

    # --- Microsserviço de chamados (Python / FastAPI) ---------------------
    location /chamados {
        proxy_pass http://api_chamados;
    }

    # Documentação interativa do FastAPI.
    location = /docs {
        proxy_pass http://api_chamados;
    }

    location = /openapi.json {
        proxy_pass http://api_chamados;
    }

    # --- Microsserviço de técnicos (Java / Spring Boot) -------------------
    location /tecnicos {
        proxy_pass http://api_tecnicos;
    }

    # Documentação interativa do springdoc.
    location /swagger-ui {
        proxy_pass http://api_tecnicos;
    }

    location = /swagger-ui.html {
        proxy_pass http://api_tecnicos;
    }

    location /v3/api-docs {
        proxy_pass http://api_tecnicos;
    }

    # Qualquer outra rota: 404 em JSON.
    location / {
        default_type application/json;
        return 404 '{"detail":"Rota não encontrada no gateway."}';
    }
}
