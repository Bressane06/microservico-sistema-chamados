spring.application.name=servico-tecnicos

# Porta da API
server.port=8081

# Configuração PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/tecnicos_db
spring.datasource.username=tecnicos_user
spring.datasource.password=senha_local_tecnicos

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Prometheus
management.prometheus.metrics.export.enabled=true

# RabbitMQ (no Docker Compose é sobrescrito por SPRING_RABBITMQ_*)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=chamados
spring.rabbitmq.password=senha_local_rabbit
# Mensagem que falha não volta para a fila indefinidamente.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
