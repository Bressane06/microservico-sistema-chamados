services:
  api-chamados:
    build: ./servico-chamados
    container_name: api-chamados
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_CHAMADOS_USER:-chamados_user}:${POSTGRES_CHAMADOS_PASSWORD:-troque_esta_senha}@db-chamados:5432/${POSTGRES_CHAMADOS_DB:-chamados_db}
      TECNICOS_API_URL: http://api-tecnicos:8081
      OTEL_SERVICE_NAME: servico-chamados
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      db-chamados:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - rede-chamados
      - rede-servicos

  db-chamados:
    image: postgres:17
    container_name: db-chamados
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_CHAMADOS_USER:-chamados_user}
      POSTGRES_PASSWORD: ${POSTGRES_CHAMADOS_PASSWORD:-troque_esta_senha}
      POSTGRES_DB: ${POSTGRES_CHAMADOS_DB:-chamados_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-chamados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rede-chamados

  api-tecnicos:
    build: ./servico-tecnicos
    container_name: api-tecnicos
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-tecnicos:5432/${POSTGRES_TECNICOS_DB:-tecnicos_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_TECNICOS_USER:-tecnicos_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_TECNICOS_PASSWORD:-troque_esta_senha}

      OTEL_SERVICE_NAME: servico-tecnicos
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      db-tecnicos:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - rede-tecnicos
      - rede-servicos

  db-tecnicos:
    image: postgres:17
    container_name: db-tecnicos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TECNICOS_USER:-tecnicos_user}
      POSTGRES_PASSWORD: ${POSTGRES_TECNICOS_PASSWORD:-troque_esta_senha}
      POSTGRES_DB: ${POSTGRES_TECNICOS_DB:-tecnicos_db}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dados-tecnicos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rede-tecnicos

  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-chamados:
        condition: service_healthy
      api-tecnicos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rede-servicos

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - rede-servicos

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - dados-prometheus:/prometheus
    depends_on:
      - api-chamados
      - api-tecnicos
    networks:
      - rede-servicos

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - dados-grafana:/var/lib/grafana
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - rede-servicos

volumes:
  dados-chamados:
  dados-tecnicos:
  dados-prometheus:
  dados-grafana:

networks:
  rede-chamados:
  rede-tecnicos:
  rede-servicos:
