global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "servico-chamados"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-chamados:8000"]

  - job_name: "servico-tecnicos"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-tecnicos:8081"]
